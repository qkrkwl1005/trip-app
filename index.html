<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="manifest" href="manifest.json">
<title>TripSync Master</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f2f4f7;--s:#fff;--s2:#f6f7fa;--s3:#e9edf3;--bd:#e2e6ee;--tx:#111827;--sub:#5b6472;--pr:#2563eb;--dg:#ef4444;--PLACE:#2563eb;--FOOD:#f59e0b;--SHOP:#8b5cf6}
[data-theme=dark]{--bg:#0f1115;--s:#181b20;--s2:#20242b;--s3:#2a2f38;--bd:#2e343e;--tx:#f3f4f6;--sub:#9ca3af;--pr:#3b82f6;--dg:#f87171;--PLACE:#60a5fa;--FOOD:#fbbf24;--SHOP:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:500 14px/1.5 "Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;letter-spacing:-.015em;color:var(--tx);background:var(--bg);display:flex;height:100vh;height:100dvh;overflow:hidden}
#side{width:440px;min-width:440px;background:var(--s);border-right:1px solid var(--bd);display:flex;flex-direction:column;height:100%}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}
.brand{display:flex;gap:10px;align-items:center}.brand b{display:block;font-size:17px;font-weight:800}.brand small{font-size:11px;color:var(--sub)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#8b5cf6,#f59e0b);display:flex;align-items:center;justify-content:center}
#nav{display:grid;grid-template-columns:repeat(5,1fr);padding:4px 8px;border-bottom:1px solid var(--bd);background:var(--s)}
.tab-btn{display:flex;flex-direction:column;align-items:center;padding:5px 2px;background:none;border:0;border-radius:9px;color:var(--sub);font-family:inherit;font-size:11px;font-weight:700;line-height:1.3;cursor:pointer;touch-action:manipulation}
.tab-btn i{font-style:normal;font-size:19px;line-height:1.2}.tab-btn.active{color:var(--pr);background:rgba(59,130,246,.14)}.tab-btn[data-tab=map]{display:none}
.tab-content{display:none;flex:1;overflow-y:auto;padding:16px;flex-direction:column;gap:10px}.tab-content.active{display:flex}
.card{background:var(--s2);border:1px solid var(--bd);border-radius:16px;padding:14px}
label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--sub)}
input[type=text],input[type=password],textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;font:inherit;color:var(--tx);background:var(--s);margin-bottom:10px;outline:0}
input:focus,textarea:focus{border-color:var(--pr)}textarea{min-height:76px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--s);padding:4px;border:1px solid var(--bd);border-radius:12px;margin-bottom:12px}
.seg div{padding:8px 2px;text-align:center;font-size:12.5px;font-weight:700;border-radius:9px;color:var(--sub);cursor:pointer}.seg .on{background:rgba(59,130,246,.18);color:var(--pr)}
.btn{width:100%;padding:12px;background:var(--pr);color:#fff;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation}.btn:disabled{opacity:.6}.btn.g{background:var(--s3);color:var(--tx);margin-bottom:8px}
.item{background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:10px;display:flex;gap:12px;align-items:center;cursor:pointer}.item.done{opacity:.55}
.pic{position:relative;width:78px;height:78px;flex:none;border-radius:12px;background:var(--s3);display:grid;place-items:center;font-size:30px;overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic.big{width:100%;height:auto;aspect-ratio:4/3;font-size:60px;margin-bottom:12px}iframe.big{width:100%;aspect-ratio:4/3;border:0;border-radius:12px;margin-bottom:12px}
.mid{flex:1;min-width:0}.nm{font-weight:700;font-size:15px;word-break:keep-all}.ds{font-size:12px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ds.in{color:var(--pr)}
.ok{font-size:12px;color:var(--pr);white-space:nowrap}
.act{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.mb{padding:7px 11px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--bd);background:var(--s);color:var(--tx);cursor:pointer;text-decoration:none;touch-action:manipulation}
.mb.pr{background:var(--pr);color:#fff;border-color:var(--pr)}.mb.dg{color:var(--dg)}
.empty{text-align:center;padding:48px 0;color:var(--sub);font-size:13px}.empty i{display:block;font-style:normal;font-size:40px}
#map-wrap{flex:1;position:relative;height:100%;z-index:0}#map{width:100%;height:100%}
#mapmsg{display:none;position:absolute;left:12px;right:12px;top:12px;z-index:1100;background:var(--s);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.map-btns{position:absolute;right:12px;bottom:12px;z-index:1100;display:flex;gap:8px}
.map-btns button{padding:10px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--s);color:var(--tx);font-family:inherit;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation}
.pin{width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5);background:var(--PLACE)}.pin.FOOD{background:var(--FOOD)}.pin.SHOP{background:var(--SHOP)}
.lnk{color:#2563eb;font-weight:700;cursor:pointer}
#sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}#sheet.on{display:flex}
.sh{background:var(--s);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,150%);max-width:90vw;z-index:9999;background:var(--s);color:var(--tx);border:1px solid var(--bd);border-left:4px solid var(--pr);padding:12px 16px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.4);font-size:13px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}#toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:820px){
#side{width:100%;min-width:0;border:0}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;grid-template-columns:repeat(6,1fr);border:0;border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tab-btn[data-tab=map]{display:flex}.tab-content{padding-bottom:100px}
#map-wrap{display:none}
body.show-map #map-wrap{display:block;position:fixed;left:0;right:0;top:0;bottom:calc(58px + env(safe-area-inset-bottom));height:auto;z-index:30}
input[type=text],input[type=password],textarea{font-size:16px}
#toast{bottom:calc(76px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<aside id="side">
  <header>
    <div class="brand"><div class="logo">⚡</div><div><b>TripSync Master</b><small>장소·먹거리·쇼핑 플래너</small></div></div>
    <button id="themeBtn" class="mb"></button>
  </header>
  <nav id="nav"></nav>

  <section id="tab-add" class="tab-content active">
    <div class="card">
      <div class="seg" id="seg"><div data-cat="PLACE" class="on">📍 장소/식당</div><div data-cat="FOOD">🍙 편의점/음식</div><div data-cat="SHOP">🛍️ 구매 물건</div></div>
      <label>지역 힌트 (선택)</label>
      <input type="text" id="hint" placeholder="예: 일본 오사카 / 강릉 / 시드니">
      <label>이름·가게명·주소</label>
      <input type="text" id="q" enterkeyhint="search" placeholder="예: 로손 카츠산도 / 이치란 도톤보리">
      <input type="file" id="file" accept="image/*" multiple hidden>
      <button class="btn g" onclick="$('file').click()" id="pc">📷 사진으로 찾기 (선택)</button>
      <button id="go" class="btn">🔎 인터넷에서 찾기</button>
    </div>
    <div id="rs"></div>
  </section>

  <section id="tab-set" class="tab-content"><div class="card">
    <label>Gemini API 키 (사진 인식 + AI 검색, 선택)</label>
    <input type="password" id="gkey" placeholder="AIza... 또는 AQ....">
    <button id="savek" class="btn g">키 저장</button>
    <label style="margin-top:14px">Google Maps API 키 (전체 지도 + 임베드, 선택)</label>
    <input type="password" id="gmapkey" placeholder="AIzaSy...">
    <button id="savegmap" class="btn g">지도 키 저장 및 적용</button>
    <label style="margin-top:14px">Google 지도를 쓰려면 Google Cloud에서 <b>Maps JavaScript API</b>가 활성화되어 있어야 합니다. 미설정 시 OpenStreetMap으로 자동 전환됩니다.</label>
    <label style="margin-top:14px">백업 / 복원 (데이터는 이 브라우저에만 저장돼요)</label>
    <textarea id="bk" placeholder="복사된 백업이 여기에 나와요. 복원하려면 붙여넣기"></textarea>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button id="bkOut" class="btn g">백업 복사</button><button id="bkIn" class="btn g">복원하기</button></div>
  </div></section>
</aside>

<main id="map-wrap">
  <div id="mapmsg">지도를 불러오지 못했어요. API 키 또는 네트워크를 확인해 주세요.</div>
  <div id="map"></div>
  <div class="map-btns">
    <button id="fitBtn">🗺️ 전체 장소</button>
    <button id="locBtn">📍 내 위치</button>
  </div>
</main>
<div id="sheet"><div class="sh" id="sbody"></div></div>
<input type="file" id="own" accept="image/*" hidden>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return 1}catch(e){return 0}}};
const CATS={PLACE:{n:'장소',e:'📍',b:'여행 장소/식당',c:'#2563eb'},FOOD:{n:'먹거리',e:'🍙',b:'편의점 음식/먹거리',c:'#f59e0b'},SHOP:{n:'쇼핑',e:'🛍️',b:'구매 물건',c:'#8b5cf6'}};
const MODELS=['gemini-2.5-flash','gemini-2.0-flash','gemini-flash-latest'];
const SUF=['',' photo',' review',' menu',' exterior'];
const isValidKey=v=>/^(AIza[\w-]{20,}|AQ\.[\w.-]{20,})$/.test(String(v||'').trim());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pic=(q,v=0)=>'https://tse1.mm.bing.net/th?w=480&h=360&c=7&rs=1&p=0&q='+encodeURIComponent(String(q||'').trim()+SUF[v%5]);

let items=[],cat='PLACE',pend=[],res=[],lm=null,tl=null,layer=null,pins={},lastGeo=0,tt,cur=null,emb=false,tileIndex=0,tileFails=0,gmap=null,gmarkers={},ginfowin=null,glocMarker=null,gScriptEl=null;
try{items=JSON.parse(ls.get('TRIP_MASTER_ITEMS')||'[]')}catch(e){items=[]}
let photoCache={};try{photoCache=JSON.parse(ls.get('TRIP_PHOTO_CACHE')||'{}')}catch(e){photoCache={}}
function savePhotoCache(){ls.set('TRIP_PHOTO_CACHE',JSON.stringify(photoCache))}

function hideToast(){const t=$('toast');if(t)t.classList.remove('show');clearTimeout(tt)}
function toast(m,ms=2200){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms)}
window.addEventListener('error',e=>{try{if(e.message)toast('오류: '+e.message)}catch(_){}});

function currentTileUrl(){return tileIndex===0?`https://{s}.basemaps.cartocdn.com/${document.documentElement.dataset.theme==='dark'?'dark':'light'}_all/{z}/{x}/{y}{r}.png`:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'}
function rebuildTiles(){
  if(!lm)return;
  if(tl)lm.removeLayer(tl);
  const carto=tileIndex===0;
  tl=L.tileLayer(currentTileUrl(),{maxZoom:19,subdomains:carto?'abcd':'abc',attribution:'© OpenStreetMap © CARTO'}).addTo(lm);
  tl.on('tileerror',onTileError);tl.on('tileload',onTileLoad);
}
function onTileError(){tileFails++;if(tileIndex===0&&tileFails>3){tileIndex=1;tileFails=0;rebuildTiles()}else if(tileIndex===1){$('mapmsg').style.display='block'}}
function onTileLoad(){tileFails=0;$('mapmsg').style.display='none'}
function setTheme(t){document.documentElement.dataset.theme=t;ls.set('TRIP_THEME',t);$('themeBtn').textContent=t==='dark'?'☀️':'🌙';if(lm)rebuildTiles()}

function destroyLeaflet(){
  if(lm){try{lm.remove()}catch(e){} lm=null;tl=null;layer=null;pins={};}
  $('map').innerHTML='';
}

function fallbackToOsm(msg){
  gmap=null;gmarkers={};
  if(!lm&&window.L){
    $('map').innerHTML='';
    lm=L.map('map').setView([36.5,128],6);
    layer=L.featureGroup().addTo(lm);
    rebuildTiles();
    draw();fit();
  }
  if(msg)toast(msg,3200);
}

window.gm_authFailure=function(){
  fallbackToOsm('Google 지도 API 키 인증 또는 Maps JavaScript API 설정 오류로 기본 지도로 표시합니다.');
};

function initGoogleMapInstance(){
  try{
    if(!window.google||!google.maps||!google.maps.Map)throw new Error('Google Maps SDK 미로드');
    destroyLeaflet();
    gmap=new google.maps.Map($('map'),{
      center:{lat:35.68,lng:135.5},
      zoom:6,
      mapTypeControl:false,
      streetViewControl:false,
      fullscreenControl:false
    });
    ginfowin=new google.maps.InfoWindow();
    $('mapmsg').style.display='none';
    draw();fit();
  }catch(e){
    fallbackToOsm('Google 지도를 초기화하지 못해 OpenStreetMap으로 전환했습니다.');
  }
}

function initMapEngine(forceReload=false){
  const rawKey=(ls.get('TRAVEL_GMAP_KEY')||'').trim();
  const validKey=isValidKey(rawKey)?rawKey:'';
  if(!validKey){
    fallbackToOsm();
    return;
  }
  if(window.google&&window.google.maps&&window.google.maps.Map&&!forceReload){
    initGoogleMapInstance();
    return;
  }
  if(gScriptEl){try{gScriptEl.remove()}catch(e){} gScriptEl=null;}
  try{delete window.google}catch(e){}
  window.__initGMap=function(){initGoogleMapInstance()};
  const s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(validKey)+'&callback=__initGMap';
  s.async=true;s.defer=true;
  s.onerror=()=>fallbackToOsm('Google 지도 스크립트를 불러오지 못했습니다.');
  gScriptEl=s;
  document.head.appendChild(s);
}

async function fetchRepPhoto(q){
  q=(q||'').trim(); if(!q) return null;
  if(photoCache[q]) return photoCache[q];
  const tryWiki=async(lang)=>{
    try{
      const s=await fetch(`https://${lang}.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(q)}&limit=1&namespace=0&format=json&origin=*`);
      const arr=await s.json();
      const title=Array.isArray(arr)&&arr[1]&&arr[1][0];
      if(!title) return null;
      const r=await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
      const d=await r.json();
      if(d&&d.thumbnail&&d.thumbnail.source) return d.thumbnail.source;
    }catch(e){}
    return null;
  };
  for(const lang of ['ko','ja','en']){
    const u=await tryWiki(lang);
    if(u){photoCache[q]=u;savePhotoCache();return u;}
  }
  try{
    const r=await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=480&format=json&origin=*`);
    const d=await r.json();
    const pages=d&&d.query&&d.query.pages;
    if(pages){for(const p in pages){const ii=pages[p].imageinfo&&pages[p].imageinfo[0]; if(ii&&(ii.thumburl||ii.url)){const u=ii.thumburl||ii.url;photoCache[q]=u;savePhotoCache();return u;}}}
  }catch(e){}
  return null;
}

(function build(){
  const tabs=[['add','🔎','찾기'],['PLACE','📍','장소'],['FOOD','🍙','먹거리'],['SHOP','🛍️','쇼핑'],['map','🗺️','지도'],['set','⚙️','설정']];
  $('nav').innerHTML=tabs.map(([k,e,n])=>`<button class="tab-btn${k==='add'?' active':''}" data-tab="${k}"><i>${e}</i><span>${n}${CATS[k]?` <span id="cnt-${k}">0</span>`:''}</span></button>`).join('');
  Object.keys(CATS).forEach(c=>{
    const s=document.createElement('section');s.id='tab-'+c;s.className='tab-content';
    s.innerHTML=`<input type="text" id="q-${c}" placeholder="${CATS[c].n} 검색..." oninput="render()"><div id="list-${c}" style="display:flex;flex-direction:column;gap:8px"></div>`;
    $('side').appendChild(s);
  });
})();

function refreshMapSize(){
  if(gmap&&window.google){
    google.maps.event.trigger(gmap,'resize');
  }else if(lm){
    lm.invalidateSize();
  }
}

function tab(k,skipFit=false){
  hideToast();
  if(k==='map'&&innerWidth>820)return;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===k));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+k));
  document.body.classList.toggle('show-map',k==='map');
  if(k==='map'){
    requestAnimationFrame(()=>{
      refreshMapSize();
      setTimeout(()=>{refreshMapSize();if(!skipFit)fit()},120);
    });
  }
}

function fit(){
  const pts=items.filter(i=>i.lat&&i.lng);
  if(!pts.length)return;
  if(gmap&&window.google){
    const bounds=new google.maps.LatLngBounds();
    pts.forEach(i=>bounds.extend({lat:i.lat,lng:i.lng}));
    gmap.fitBounds(bounds);
    if(pts.length===1)gmap.setZoom(16);
    return;
  }
  if(!lm||!layer)return;
  const b=layer.getBounds();
  if(b.isValid())lm.fitBounds(b,{padding:[40,40],maxZoom:16});
}

function draw(){
  const validItems=items.filter(i=>i.lat&&i.lng);
  if(gmap&&window.google){
    Object.values(gmarkers).forEach(m=>m.setMap(null));
    gmarkers={};
    validItems.forEach(i=>{
      const color=(CATS[i.category]&&CATS[i.category].c)||'#2563eb';
      const m=new google.maps.Marker({
        position:{lat:i.lat,lng:i.lng},
        map:gmap,
        title:i.name,
        icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:color,fillOpacity:1,strokeColor:'#fff',strokeWeight:2.5}
      });
      m.addListener('click',()=>{
        if(ginfowin){
          ginfowin.setContent(`<div style="color:#111;font-size:13px;line-height:1.4;padding:2px 4px"><b>${esc(i.name)}</b><br><span style="color:#555;font-size:11px">${esc(i.address||'')}</span><br><span class="lnk" data-act="open" data-id="${i.id}">사진·상세 보기 ›</span></div>`);
          ginfowin.open(gmap,m);
        }
      });
      gmarkers[i.id]=m;
    });
    return;
  }
  if(!lm||!layer)return;
  layer.clearLayers();pins={};
  validItems.forEach(i=>{
    pins[i.id]=L.marker([i.lat,i.lng],{icon:L.divIcon({className:'',html:`<div class="pin ${i.category}"></div>`,iconSize:[20,20],iconAnchor:[10,10]})})
      .bindPopup(`<b>${esc(i.name)}</b><br>${esc(i.address||'')}<br><span class="lnk" data-act="open" data-id="${i.id}">사진·상세 보기 ›</span>`).addTo(layer);
  });
}

const card=i=>`<div class="item${i.done?' done':''}" data-act="open" data-id="${i.id}">${ph(CATS[i.category].e,i.img)}<div class="mid"><div class="nm">${esc(i.name)}</div><div class="ds">${esc(i.address||i.note||'')}</div>${i.info?`<div class="ds in">${esc(i.info)}</div>`:''}</div><input type="checkbox" data-act="done" data-id="${i.id}"${i.done?' checked':''}></div>`;
function ph(e,src,c=''){return `<div class="pic ${c}">${e}${src?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(src)}" onerror="this.remove()">`:''}</div>`}
function render(){
  for(const c in CATS){
    const kw=($('q-'+c).value\vert{}\vert{}'').trim().toLowerCase(),all=items.filter(i=>i.category===c);$('cnt-'+c).textContent=all.length;
    const l=all.filter(i=>!kw||((i.name||'')+(i.address||'')).toLowerCase().includes(kw));
    $('list-'+c).innerHTML=l.length?l.map(card).join(''):`<div class="empty"><i>${CATS[c].e}</i>${all.length?'검색 결과가 없어요':'찾기 탭에서 추가해 보세요'}</div>`;
  }
}
function persist(){if(!ls.set('TRIP_MASTER_ITEMS',JSON.stringify(items)))toast('저장 공간이 부족해요. 설정에서 백업 후 정리하세요')}
function save(){persist();render();draw()}

function showSheet(){
  const i=items.find(x=>x.id===cur);if(!i)return closeSheet();
  const qStr=(i.name+' '+(i.address||'')).trim();
  const q=encodeURIComponent(qStr);
  const coordQ=(i.lat&&i.lng)?encodeURIComponent(`${i.lat},${i.lng} (${i.name})`):q;
  let mapFrame='';
  if(emb){
    mapFrame=`<iframe class="big" src="https://maps.google.com/maps?q=${ q || coordQ }&z=16&output=embed&hl=ko" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
  }
  $('sbody').innerHTML=(emb?mapFrame:ph(CATS[i.category].e,i.img,'big'))
  +`<div class="nm" style="font-size:19px">${esc(i.name)}</div><div class="ds" style="-webkit-line-clamp:4">${esc(i.address||'')}</div>${i.info?`<div class="ds in">${esc(i.info)}</div>`:''}
  <div class="act"><button class="mb" data-act="rot">↻ 다른 사진</button><button class="mb" data-act="photo">🖼️ 대표 사진</button><button class="mb" data-act="own">📷 내 사진</button><button class="mb" data-act="emb">${emb?'🖼️ 사진 보기':'🗺️ 인앱 지도'}</button>${i.lat?'<button class="mb" data-act="pin">📍 전체 지도에서 보기</button>':''}<button class="mb" data-act="share">↗ 공유</button></div>
  <textarea id="memo" placeholder="메모 (가격, 영업시간, 같이 갈 사람...)">${esc(i.note||'')}</textarea>
  <div class="act"><a class="mb pr" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">구글맵 앱 열기 ↗</a><a class="mb" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(i.name)}">구글 검색 ↗</a><button class="mb dg" data-act="del">삭제</button><button class="mb" data-act="close" style="margin-left:auto">닫기</button></div>`;
  $('sheet').classList.add('on');
}
function closeSheet(){$('sheet').classList.remove('on');cur=null}

const shrink=(f,m=1024,q=.8)=>new Promise((ok,no)=>{
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(u);const s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>no(new Error('사진을 읽을 수 없어요'));im.src=u;
});

const mkPrompt=(h,q)=>`입력(텍스트·사진)에 해당하는 실제 ${CATS[cat].b} 후보를 구글 검색으로 확인해 가능성 높은 순서로 최대 4개, 다른 설명 없이 JSON 배열만 출력하세요.
형식: {"name":"한국어 이름 (현지어)","address":"현지어 주소 또는 빈 문자열","lat":숫자 또는 null,"lng":숫자 또는 null,"info":"한 줄 정보(영업시간·가격·특징)"}
${cat==='PLACE'?'주소와 위도·경도를 꼭 찾으세요.':'제품명, 대략 가격, 살 수 있는 곳을 info에 쓰세요.'}
지역: ${h||'없음'}
입력: ${q||'(사진만)'}`;

async function ask(key,parts){
  let err=new Error('AI 호출 실패');
  for(const m of MODELS){
    try{
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts}],tools:[{google_search:{}}]})});
      const d=await r.json();
      if(!r.ok)throw new Error((d.error&&d.error.message)||('HTTP '+r.status));
      const t=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||'').join(''),a=t.indexOf('['),b=t.lastIndexOf(']');
      if(a<0||b<a)throw new Error('AI 응답을 해석하지 못했어요');
      const j=JSON.parse(t.slice(a,b+1));
      if(!Array.isArray(j))throw new Error('AI 응답 형식 오류');
      return j;
    }catch(e){err=e}
  }
  throw err;
}
async function nomi(q){
  const w=1100-(Date.now()-lastGeo);if(w>0)await sleep(w);lastGeo=Date.now();
  try{const d=await(await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=ko&q='+encodeURIComponent(q))).json();return d.map(x=>({name:x.name||x.display_name.split(',')[0],address:x.display_name,lat:+x.lat,lng:+x.lon}))}catch(e){return[]}
}
const km=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
async function locate(o,h){
  const ai=typeof o.lat==='number'&&typeof o.lng==='number'?{lat:o.lat,lng:o.lng}:null;
  let g=null;
  for(const q of [o.address,(h+' '+o.name).trim()]){if(q&&q.trim()&&!g){const r=await nomi(q.trim());if(r[0])g=r[0]}}
  if(g&&ai&&km(g.lat,g.lng,ai.lat,ai.lng)>50)g=null;
  return g?{lat:g.lat,lng:g.lng}:ai;
}

async function find(){
  const q=$('q').value.trim(),h=$('hint').value.trim(),key=ls.get('TRAVEL_GEMINI_KEY')\vert{}\vert{}'',btn=$('go');
  if(!q&&!pend.length)return toast('검색어를 입력하거나 사진을 선택하세요');
  btn.disabled=true;btn.textContent='인터넷에서 찾는 중...';
  let list=null,note='';
  try{
    if(key){
      try{
        const imgs=(await Promise.all(pend.map(f=>shrink(f)))).map(u=>({inlineData:{mimeType:'image/jpeg',data:u.split(',')[1]}}));
        list=await ask(key,[...imgs,{text:mkPrompt(h,q)}]);
      }catch(e){note='AI 검색 실패: '+e.message}
    }else if(pend.length)note='사진 인식은 설정 탭에서 Gemini 키가 필요해요';
    if((!list||!list.length)&&cat==='PLACE'&&q){list=await nomi((h+' '+q).trim());if(!list.length&&h)list=await nomi(q)}
    list=(list||[]).filter(c=>c&&c.name).slice(0,5);
    const seen=new Set();
    list=list.filter(c=>{const k=String(c.name).toLowerCase().replace(/\s+/g,'');if(seen.has(k))return false;seen.add(k);return true});
    if(q&&!list.some(c=>String(c.name).toLowerCase().replace(/\s+/g,'')===String(q).toLowerCase().replace(/\s+/g,'')))list.push({name:q,raw:1});
    res=list.map(c=>({...c,h,v:0,cat,img:pic(c.name+' '+(h||''))}));
    drawRes();
    res.forEach(c=>{fetchRepPhoto(c.name+' '+(c.address||h||'')).then(u=>{if(u){c.img=u;drawRes()}})});
    if(note)toast(note);
  }catch(e){toast('오류: '+e.message)}
  finally{btn.disabled=false;btn.textContent='🔎 인터넷에서 찾기'}
}
const cc=(c,k)=>`<div class="item" data-act="pick" data-k="${k}">${ph(CATS[c.cat].e,c.img)}<div class="mid"><div class="nm">${esc(c.name)}</div><div class="ds">${c.raw?'입력한 그대로 저장':esc(c.address||'')}</div>${c.info?`<div class="ds in">${esc(c.info)}</div>`:''}<button class="mb" style="margin-top:5px" data-act="sw" data-k="${k}">↻ 다른 사진</button></div><b class="ok">${c.saved?'✓ 저장됨':'선택'}</b></div>`;
function drawRes(){$('rs').innerHTML=res.length?`<div class="ds" style="margin:2px 2px 8px">맞는 항목을 눌러 저장하세요. 사진이 다르면 ↻</div><div style="display:flex;flex-direction:column;gap:8px">${res.map(cc).join('')}</div>`:''}
async function pick(k){
  const c=res[k];if(!c||c.saved)return;
  c.saved=1;drawRes();
  let p=c.lat&&c.lng?{lat:c.lat,lng:c.lng}:null;
  if(c.cat==='PLACE'&&!p){toast('위치 확인 중...');p=await locate(c,c.h)}
  const id='i'+Date.now()+Math.random().toString(36).slice(2,5);
  items.unshift({id,category:c.cat,name:c.name,address:c.address||'',info:c.info||'',lat:p?p.lat:0,lng:p?p.lng:0,img:c.img||pic(c.name+' '+c.h,c.v),q:c.name+' '+c.h,v:c.v||0,done:false});
  save();fit();toast('저장했어요 · '+CATS[c.cat].n+' 탭에서 볼 수 있어요');
  fetchRepPhoto(c.name+' '+(c.address||c.h||'')).then(u=>{if(u){const it=items.find(x=>x.id===id);if(it){it.img=u;save();if(cur===id)showSheet()}}});
}

document.addEventListener('click',e=>{
  if(e.target.id==='sheet')return closeSheet();
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,i=items.find(x=>x.id===(b.dataset.id||cur));
  if(a==='sw'){res[b.dataset.k].v++;const c=res[b.dataset.k];c.img=pic(c.name+' '+c.h,c.v);drawRes()}
  else if(a==='pick')pick(+b.dataset.k);
  else if(a==='open'){emb=false;cur=b.dataset.id;showSheet()}
  else if(a==='close')closeSheet();
  else if(a==='rot'&&i){emb=false;i.v=(i.v||0)+1;i.img=pic(i.q||i.name,i.v);save();showSheet()}
  else if(a==='photo'&&i){(async()=>{emb=false;toast('대표 사진 찾는 중...');const u=await fetchRepPhoto(i.name+' '+(i.address||''));if(u){i.img=u;save();showSheet();toast('대표 사진을 찾았어요')}else toast('대표 사진을 찾지 못했어요')})()}
  else if(a==='own')$('own').click();
  else if(a==='emb'){emb=!emb;showSheet()}
  else if(a==='pin'&&i){
    closeSheet();
    tab('map',true);
    setTimeout(()=>{
      refreshMapSize();
      if(gmap&&window.google){
        gmap.setCenter({lat:i.lat,lng:i.lng});
        gmap.setZoom(16);
        if(gmarkers[i.id])google.maps.event.trigger(gmarkers[i.id],'click');
      }else if(lm){
        lm.setView([i.lat,i.lng],16);
        if(pins[i.id])pins[i.id].openPopup();
      }
    },180);
  }
  else if(a==='share'&&i){if(navigator.share){navigator.share({title:i.name,text:i.address||'',url:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(i.name+' '+(i.address||''))}`}).catch(()=>{})}else toast('공유를 지원하지 않는 브라우저예요')}
  else if(a==='del'&&i){if(b.dataset.sure){items=items.filter(x=>x.id!==i.id);closeSheet();save()}else{b.dataset.sure=1;b.textContent='한 번 더 누르면 삭제'}}
});
document.addEventListener('change',e=>{
  const b=e.target.closest('[data-act="done"]');if(!b)return;
  const i=items.find(x=>x.id===b.dataset.id);if(i){i.done=b.checked;save()}
});
document.addEventListener('input',e=>{if(e.target.id==='memo'){const i=items.find(x=>x.id===cur);if(i){i.note=e.target.value;persist()}}});
$('own').onchange=async e=>{ const f=e.target.files[0],i=items.find(x=>x.id===cur);e.target.value='';if(!f\vert{}\vert{}!i)return; try{i.img=await shrink(f,480,.72);emb=false;save();showSheet()}catch(err){toast(err.message)} };$('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)tab(b.dataset.tab)};
$('seg').onclick=e=>{const d=e.target.closest('[data-cat]');if(!d)return;cat=d.dataset.cat;[...$('seg').children].forEach(x=>x.classList.toggle('on',x===d))};
$('file').onchange=e=>{pend=[...e.target.files];e.target.value='';$('pc').textContent=pend.length?`📷 사진 ${pend.length}장 선택됨 (다시 누르면 변경)`:'📷 사진으로 찾기 (선택)'};
$('go').onclick=find;
$('q').onkeydown=e=>{if(e.key==='Enter')find()};$('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

$('savek').onclick=()=>{
  const v=$('gkey').value.trim();
  if(v&&!isValidKey(v)){toast('올바른 Gemini API 키 형식이 아니에요');return;}
  ls.set('TRAVEL_GEMINI_KEY',v);
  toast('Gemini API 키가 저장되었습니다.');
};
$('savegmap').onclick=()=>{
  const v=$('gmapkey').value.trim();
  if(v&&!isValidKey(v)){toast('올바른 Google Maps API 키 형식이 아니에요');return;}
  ls.set('TRAVEL_GMAP_KEY',v);
  toast('지도 API 키를 저장하고 지도를 갱신합니다.');
  initMapEngine(true);
};
$('bkOut').onclick=()=>{const t=JSON.stringify(items);$('bk').value=t;$('bk').select();try{navigator.clipboard.writeText(t).then(()=>toast('백업을 복사했어요. 메모 앱 등에 붙여넣어 보관하세요')).catch(()=>toast('위 내용을 직접 복사해 보관하세요'))}catch(e){toast('위 내용을 직접 복사해 보관하세요')}};
$('bkIn').onclick=()=>{try{const d=JSON.parse($('bk').value);if(!Array.isArray(d))throw 0;items=d;save();fit();toast(d.length+'개 항목을 복원했어요')}catch(e){toast('백업 내용이 올바르지 않아요')}};
addEventListener('resize',refreshMapSize);

setTheme(ls.get('TRIP_THEME')||'dark');
const _gk=ls.get('TRAVEL_GEMINI_KEY')||''; if(_gk&&!isValidKey(_gk)) ls.set('TRAVEL_GEMINI_KEY','');
const _gm=ls.get('TRAVEL_GMAP_KEY')||''; if(_gm&&!isValidKey(_gm)) ls.set('TRAVEL_GMAP_KEY','');
$('gkey').value=ls.get('TRAVEL_GEMINI_KEY')\vert{}\vert{}'';$('gmapkey').value=ls.get('TRAVEL_GMAP_KEY')||'';

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(!ls.get('TRIP_ONBOARD')){setTimeout(()=>toast('찾기 탭에서 장소를 추가해 보세요. 사진·이름으로 검색할 수 있어요.'),800);ls.set('TRIP_ONBOARD','1')}

let locating=false;
function requestLocation(){
  if(locating) return;
  if(!navigator.geolocation){ toast('이 브라우저는 위치 정보를 지원하지 않아요'); return; }
  if(location.protocol!=='https:'&&location.hostname!=='localhost'){ toast('위치 기능은 HTTPS에서만 동작해요'); return; }
  locating=true; toast('현재 위치 확인 중...');
  navigator.geolocation.getCurrentPosition(pos=>{
    locating=false;
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    if(gmap&&window.google){
      if(glocMarker) glocMarker.setMap(null);
      glocMarker=new google.maps.Marker({position:{lat,lng},map:gmap,title:'내 위치',icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#2563eb',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});
      gmap.setCenter({lat,lng}); gmap.setZoom(15);
    } else if(lm){
      if(glocMarker&&lm.hasLayer&&lm.hasLayer(glocMarker)) lm.removeLayer(glocMarker);
      glocMarker=L.circleMarker([lat,lng],{radius:8,color:'#fff',fillColor:'#2563eb',fillOpacity:1}).addTo(lm);
      lm.setView([lat,lng],15);
    }
    toast('현재 위치로 이동했어요');
  },err=>{
    locating=false;
    if(err.code===1) toast('위치 권한이 거부되었어요. 설정에서 허용해 주세요');
    else if(err.code===2) toast('위치를 확인할 수 없어요');
    else toast('위치 확인 시간이 초과되었어요');
  },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
$('locBtn').onclick=requestLocation;
$('fitBtn').onclick=()=>{
  if(!items.some(i=>i.lat&&i.lng)){toast('저장된 장소가 없어요');return;}
  fit();
  toast('저장된 전체 장소로 이동했어요');
};

render();
initMapEngine(false);
</script>
