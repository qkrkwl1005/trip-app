<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Map Extractor & My Maps Sync</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --panel: #ffffff;
      --border: #dee2e6;
      --primary: #1a73e8;
      --danger: #d93025;
      --text: #202124;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Noto Sans JP", sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 440px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      padding: 16px;
      gap: 16px;
    }
    #map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }
    #map { width: 100%; height: 100%; }
    h1 { font-size: 18px; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    h2 { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #3c4043; }
    .section {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      background: #fafafa;
    }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #5f6368; }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    textarea { resize: vertical; min-height: 80px; }
    button {
      width: 100%;
      padding: 9px 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.92; }
    button:disabled { background: #adb5bd; cursor: not-allowed; }
    .btn-secondary { background: #5f6368; margin-top: 6px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .place-list {
      list-style: none;
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
    }
    .place-item {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .place-item:last-child { border-bottom: none; }
    .badge-new { background: #fce8e6; color: #c5221f; padding: 2px 6px; border-radius: 3px; font-weight: 600; font-size: 11px; }
    .badge-plan { background: #e8f0fe; color: #1967d2; padding: 2px 6px; border-radius: 3px; font-weight: 600; font-size: 11px; }
    .status-log {
      font-size: 12px;
      color: #3c4043;
      background: #f1f3f4;
      padding: 8px;
      border-radius: 4px;
      white-space: pre-wrap;
      max-height: 120px;
      overflow-y: auto;
    }
    .del-btn {
      width: auto;
      padding: 4px 8px;
      background: var(--danger);
      font-size: 11px;
    }
  </style>
</head>
<body>

<div id="sidebar">
  <h1>다국어 여행 장소 추출 및 지도 연동</h1>

  <!-- 1. API 키 설정 -->
  <div class="section">
    <h2>1. API 키 설정 (브라우저 로컬 저장)</h2>
    <label>Google Maps JavaScript API Key (Places API 활성화 필수)</label>
    <input type="password" id="gmaps-key" placeholder="AIzaSy...">
    <label>Gemini API Key (다국어 텍스트/이미지 추출용)</label>
    <input type="password" id="gemini-key" placeholder="AIzaSy...">
    <button id="save-keys-btn">API 키 저장 및 지도 초기화</button>
  </div>

  <!-- 2. 기존 계획표 (구글 내 지도 KML/CSV) 연동 -->
  <div class="section">
    <h2>2. 기존 계획표 불러오기 (구글 내 지도 연동)</h2>
    <label>구글 '내 지도'에서 내보낸 KML 또는 CSV 파일 선택</label>
    <input type="file" id="plan-file" accept=".kml,.csv">
  </div>

  <!-- 3. 사진/릴스/숏츠 다중 장소 추출 -->
  <div class="section">
    <h2>3. 다중 이미지 및 텍스트 장소 추출 (한/영/일)</h2>
    <label>기본 여행 국가/도시 힌트 (동음이의어 오류 방지용, 선택사항)</label>
    <input type="text" id="region-hint" placeholder="예: 일본 교토, 오사카 / Tokyo, Japan / 서울">
    
    <label>릴스·숏츠 캡처 이미지 또는 사진 (여러 장 동시 선택 가능)</label>
    <input type="file" id="image-files" accept="image/*" multiple style="margin-bottom:8px;">
    
    <label>릴스·숏츠 본문 텍스트, 댓글, 또는 가게명 목록 (한/영/일 혼용 가능)</label>
    <textarea id="raw-text" placeholder="릴스 본문 복사본, 유튜브 숏츠 설명란, 또는 가게 이름들을 여러 개 입력하세요."></textarea>
    
    <button id="extract-btn">장소 일괄 추출 및 지도에 표시</button>
  </div>

  <!-- 4. 상태 로그 및 장소 목록 -->
  <div class="section">
    <h2>4. 처리 상태 및 등록된 장소 목록</h2>
    <div id="status-log" class="status-log">API 키를 입력하고 지도를 초기화하세요.</div>
    <ul id="place-list" class="place-list" style="margin-top:8px;"></ul>
    <div class="btn-row">
      <button id="export-csv-btn" class="btn-secondary">구글 내 지도용 CSV 다운로드</button>
      <button id="export-kml-btn" class="btn-secondary">구글 내 지도용 KML 다운로드</button>
    </div>
  </div>
</div>

<div id="map-container">
  <div id="map"></div>
</div>

<script>
  let map = null;
  let placesService = null;
  let markers = [];
  let savedPlaces = []; // { id, name, address, lat, lng, category, sourceType: 'PLAN' | 'NEW', notes }

  const logEl = document.getElementById('status-log');
  function logStatus(msg) {
    logEl.textContent = msg;
  }

  // 로컬 스토리지에서 API 키 복원
  window.addEventListener('DOMContentLoaded', () => {
    const savedGmapsKey = localStorage.getItem('TRAVEL_GMAPS_KEY') || '';
    const savedGeminiKey = localStorage.getItem('TRAVEL_GEMINI_KEY') || '';
    document.getElementById('gmaps-key').value = savedGmapsKey;
    document.getElementById('gemini-key').value = savedGeminiKey;
    if (savedGmapsKey) {
      loadGoogleMapsScript(savedGmapsKey);
    }
  });

  document.getElementById('save-keys-btn').addEventListener('click', () => {
    const gmapsKey = document.getElementById('gmaps-key').value.trim();
    const geminiKey = document.getElementById('gemini-key').value.trim();
    if (!gmapsKey || !geminiKey) {
      logStatus('오류: Google Maps API 키와 Gemini API 키를 모두 입력해야 합니다.');
      return;
    }
    localStorage.setItem('TRAVEL_GMAPS_KEY', gmapsKey);
    localStorage.setItem('TRAVEL_GEMINI_KEY', geminiKey);
    loadGoogleMapsScript(gmapsKey);
  });

  function loadGoogleMapsScript(apiKey) {
    if (window.google && window.google.maps) {
      initMap();
      return;
    }
    logStatus('Google Maps 스크립트를 불러오는 중...');
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&libraries=places&language=ko& callback=initMap`;
    script.async = true;
    script.defer = true;
    script.onerror = () => logStatus('오류: Google Maps API 스크립트 로드 실패. API 키를 확인하세요.');
    document.head.appendChild(script);
  }

  window.initMap = function() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 35.6812, lng: 139.7671 }, // 기본 중심: 도쿄역
      zoom: 6,
      mapTypeControl: true
    });
    placesService = new google.maps.places.PlacesService(map);
    logStatus('지도 초기화 완료. 기존 일정 파일을 불러오거나 이미지/텍스트를 입력하세요.');
  };

  // 파일을 Base64로 변환
  function fileToGenerativePart(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64Data = reader.result.split(',')[1];
        resolve({
          inlineData: {
            data: base64Data,
            mimeType: file.type
          }
        });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Gemini API를 통한 다국어(한/영/일) 장소 추출
  document.getElementById('extract-btn').addEventListener('click', async () => {
    const geminiKey = localStorage.getItem('TRAVEL_GEMINI_KEY');
    if (!geminiKey || !placesService) {
      logStatus('오류: 먼저 API 키를 저장하고 지도를 초기화해야 합니다.');
      return;
    }

    const regionHint = document.getElementById('region-hint').value.trim();
    const rawText = document.getElementById('raw-text').value.trim();
    const imageFiles = document.getElementById('image-files').files;

    if (!rawText && imageFiles.length === 0) {
      logStatus('오류: 분석할 이미지나 텍스트를 최소 1개 이상 입력하세요.');
      return;
    }

    const btn = document.getElementById('extract-btn');
    btn.disabled = true;
    logStatus('1/2단계: Gemini AI가 이미지 및 텍스트에서 다국어 장소명을 추출하는 중...');

    try {
      const parts = [];
      for (const file of imageFiles) {
        const part = await fileToGenerativePart(file);
        parts.push(part);
      }

      const systemPrompt = `
당신은 다국어(한국어, 영어, 일본어) 여행 장소 추출기입니다.
제공된 이미지(인스타그램 릴스, 유튜브 숏츠 캡처 등)와 텍스트에서 언급된 모든 식당, 카페, 상점, 관광지, 숙소 등의 구체적인 장소명을 빠짐없이 추출하세요.
지역 힌트: "${regionHint || '없음 (이미지/텍스트 문맥에서 추론)'}"

반드시 아래 규칙을 지켜 JSON 배열로만 응답하세요:
1. 각 장소에 대해 Google Maps Places API 검색 정확도를 극대화할 수 있는 검색어(search_query)를 생성하세요.
   - 일본 장소인 경우 가능한 한 일본어 원문 상호명과 지역명을 결합하세요 (예: "京都 嵐山 ％ ΔRΔBICΔ", "大阪 難波 自由軒").
   - 영어권 장소는 영어 상호명과 도시명을 결합하세요.
   - 한국 장소는 한국어 상호명과 지역명을 결합하세요.
2. display_name에는 사용자가 알아보기 쉬운 이름(원문 + 한국어 표기 병기)을 적으세요.
3. category에는 음식점, 카페, 관광지, 쇼핑, 숙소 중 하나를 기입하세요.
`;

      parts.push({ text: `${systemPrompt}\n\n[입력 텍스트]:\n${rawText || '(텍스트 없음)'}` });

      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(geminiKey)}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: {
                    display_name: { type: "STRING" },
                    search_query: { type: "STRING" },
                    category: { type: "STRING" },
                    notes: { type: "STRING" }
                  },
                  required: ["display_name", "search_query", "category"]
                }
              }
            }
          })
        }
      );

      if (!response.ok) {
        throw new Error(`Gemini API 호출 실패 (HTTP ${response.status})`);
      }

      const data = await response.json();
      const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
      const extractedList = JSON.parse(jsonText);

      if (extractedList.length === 0) {
        logStatus('추출된 장소가 없습니다. 텍스트나 이미지를 확인하세요.');
        btn.disabled = false;
        return;
      }

      logStatus(`2/2단계: 총 ${extractedList.length}개 장소를 Google Places API로 좌표 검증 중...`);
      let successCount = 0;
      let failList = [];

      for (const item of extractedList) {
        const found = await searchGooglePlace(item.search_query);
        if (found) {
          addPlaceToState({
            id: found.place_id || `${Date.now()}-${Math.random()}`,
            name: `${item.display_name} (${found.name})`,
            address: found.formatted_address || '',
            lat: found.geometry.location.lat(),
            lng: found.geometry.location.lng(),
            category: item.category || '기타',
            sourceType: 'NEW',
            notes: item.notes || `검색어: ${item.search_query}`
          });
          successCount++;
        } else {
          failList.push(item.display_name);
        }
      }

      renderMapAndList();
      let resultMsg = `완료: ${extractedList.length}개 중 ${successCount}개 장소 지도에 표시됨.`;
      if (failList.length > 0) {
        resultMsg += `\n검색 실패(${failList.length}건): ${failList.join(', ')}`;
      }
      logStatus(resultMsg);
    } catch (err) {
      logStatus(`오류 발생: ${err.message}`);
    } finally {
      btn.disabled = false;
    }
  });

  // Google Places API TextSearch 래퍼
  function searchGooglePlace(query) {
    return new Promise((resolve) => {
      const request = { query: query };
      placesService.textSearch(request, (results, status) => {
        if (status === google.maps.places.PlacesServiceStatus.OK && results && results.length > 0) {
          resolve(results[0]);
        } else {
          resolve(null);
        }
      });
    });
  }

  function addPlaceToState(placeObj) {
    const exists = savedPlaces.some(
      p => (Math.abs(p.lat - placeObj.lat) < 0.0001 && Math.abs(p.lng - placeObj.lng) < 0.0001)
    );
    if (!exists) {
      savedPlaces.push(placeObj);
    }
  }

  // 지도 마커 및 사이드바 리스트 렌더링
  function renderMapAndList() {
    if (!map) return;
    markers.forEach(m => m.setMap(null));
    markers = [];

    const listEl = document.getElementById('place-list');
    listEl.innerHTML = '';

    const bounds = new google.maps.LatLngBounds();

    savedPlaces.forEach((place, idx) => {
      const position = { lat: place.lat, lng: place.lng };
      bounds.extend(position);

      // 기존 계획표(PLAN)는 파란색, 신규 추출(NEW)은 빨간색 마커로 구분
      const pinColor = place.sourceType === 'PLAN' ? '#1a73e8' : '#d93025';
      const svgMarker = {
        path: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z",
        fillColor: pinColor,
        fillOpacity: 1,
        strokeWeight: 1.5,
        strokeColor: "#ffffff",
        scale: 1.6,
        anchor: new google.maps.Point(12, 22)
      };

      const marker = new google.maps.Marker({
        position,
        map,
        title: place.name,
        icon: svgMarker
      });

      const infoWindow = new google.maps.InfoWindow({
        content: `<div style="font-size:13px;max-width:240px;">
          <strong>${escapeHtml(place.name)}</strong><br>
          <span style="color:#5f6368;">${escapeHtml(place.category)} | ${place.sourceType === 'PLAN' ? '기존 계획표' : '신규 추출'}</span><br>
          <span>${escapeHtml(place.address)}</span><br>
          <a href="https://www.google.com/maps/search/?api=1&query=${place.lat},${place.lng}" target="_blank">구글 맵에서 열기</a>
        </div>`
      });

      marker.addListener('click', () => infoWindow.open(map, marker));
      markers.push(marker);

      const li = document.createElement('li');
      li.className = 'place-item';
      li.innerHTML = `
        <div style="cursor:pointer;flex:1;" onclick="focusPlace(${idx})">
          <span class="${place.sourceType === 'PLAN' ? 'badge-plan' : 'badge-new'}">
            ${place.sourceType === 'PLAN' ? '기존일정' : '신규추출'}
          </span>
          <strong>${escapeHtml(place.name)}</strong>
          <div style="color:#5f6368;font-size:11px;">${escapeHtml(place.address)}</div>
        </div>
        <button class="del-btn" onclick="removePlace(${idx})">삭제</button>
      `;
      listEl.appendChild(li);
    });

    if (savedPlaces.length > 0) {
      map.fitBounds(bounds);
    }
  }

  window.focusPlace = function(index) {
    const p = savedPlaces[index];
    if (!p || !map) return;
    map.setCenter({ lat: p.lat, lng: p.lng });
    map.setZoom(16);
    google.maps.event.trigger(markers[index], 'click');
  };

  window.removePlace = function(index) {
    savedPlaces.splice(index, 1);
    renderMapAndList();
  };

  // 기존 계획표 (KML 또는 CSV) 파싱 및 로드
  document.getElementById('plan-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const ext = file.name.split('.').pop().toLowerCase();

    let count = 0;
    if (ext === 'kml') {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(text, "text/xml");
      const placemarks = xmlDoc.getElementsByTagName("Placemark");
      for (let i = 0; i < placemarks.length; i++) {
        const nameNode = placemarks[i].getElementsByTagName("name")[0];
        const descNode = placemarks[i].getElementsByTagName("description")[0];
        const coordNode = placemarks[i].getElementsByTagName("coordinates")[0];
        if (coordNode) {
          const coords = coordNode.textContent.trim().split(',');
          const lng = parseFloat(coords[0]);
          const lat = parseFloat(coords[1]);
          if (!isNaN(lat) && !isNaN(lng)) {
            addPlaceToState({
              id: `plan-kml-${i}`,
              name: nameNode ? nameNode.textContent.trim() : `일정 장소 ${i + 1}`,
              address: descNode ? descNode.textContent.trim() : '기존 KML 일정',
              lat,
              lng,
              category: '기존 계획표',
              sourceType: 'PLAN',
              notes: 'KML에서 불러옴'
            });
            count++;
          }
        }
      }
    } else if (ext === 'csv') {
      const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
      if (lines.length > 1) {
        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
        const nameIdx = headers.findIndex(h => h.includes('name') || h.includes('이름') || h.includes('title'));
        const latIdx = headers.findIndex(h => h.includes('lat') || h.includes('위도'));
        const lngIdx = headers.findIndex(h => h.includes('lng') || h.includes('lon') || h.includes('경도'));
        const addrIdx = headers.findIndex(h => h.includes('address') || h.includes('주소') || h.includes('desc'));

        for (let i = 1; i < lines.length; i++) {
          const cols = parseCsvLine(lines[i]);
          const lat = parseFloat(cols[latIdx]);
          const lng = parseFloat(cols[lngIdx]);
          if (!isNaN(lat) && !isNaN(lng)) {
            addPlaceToState({
              id: `plan-csv-${i}`,
              name: cols[nameIdx] || `일정 장소 ${i}`,
              address: addrIdx !== -1 ? cols[addrIdx] : '기존 CSV 일정',
              lat,
              lng,
              category: '기존 계획표',
              sourceType: 'PLAN',
              notes: 'CSV에서 불러옴'
            });
            count++;
          }
        }
      }
    }

    renderMapAndList();
    logStatus(`기존 계획표 파일에서 총 ${count}개의 장소를 불러와 파란색 핀으로 표시했습니다.`);
  });

  function parseCsvLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        inQuotes = !inQuotes;
      } else if (ch === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current.trim());
    return result;
  }

  // 구글 내 지도(Google My Maps) 가져오기용 CSV 내보내기
  document.getElementById('export-csv-btn').addEventListener('click', () => {
    if (savedPlaces.length === 0) {
      logStatus('내보낼 장소가 없습니다.');
      return;
    }
    const header = 'Name,Category,Source,Address,Latitude,Longitude,Notes\n';
    const rows = savedPlaces.map(p => {
      const esc = s => `"${String(s || '').replace(/"/g, '""')}"`;
      return [esc(p.name), esc(p.category), esc(p.sourceType), esc(p.address), p.lat, p.lng, esc(p.notes)].join(',');
    }).join('\n');

    downloadFile('\uFEFF' + header + rows, 'google_mymaps_places.csv', 'text/csv;charset=utf-8;');
  });

  // 구글 내 지도(Google My Maps) 가져오기용 KML 내보내기
  document.getElementById('export-kml-btn').addEventListener('click', () => {
    if (savedPlaces.length === 0) {
      logStatus('내보낼 장소가 없습니다.');
      return;
    }
    const placemarks = savedPlaces.map(p => `
      <Placemark>
        <name>${escapeXml(p.name)}</name>
        <description>${escapeXml(`[${p.category}] ${p.address} (${p.notes || ''})`)}</description>
        <Point>
          <coordinates>${p.lng},${p.lat},0</coordinates>
        </Point>
      </Placemark>`).join('\n');

    const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Travel Extracted Places</name>
    ${placemarks}
  </Document>
</kml>`;

    downloadFile(kml, 'google_mymaps_places.kml', 'application/vnd.google-earth.kml+xml');
  });

  function downloadFile(content, fileName, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeXml(str) {
    return escapeHtml(str).replace(/'/g, '&apos;');
  }
</script>
</body>
</html>
