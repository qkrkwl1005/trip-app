<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Map Extractor & My Maps Sync</title>
  <!-- 부드럽고 가독성 높은 한/영/일 웹폰트 로드 (Pretendard + Noto Sans JP) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --card: #f8f9fa;
      --border: #dce1e7;
      --text: #1b1d1f;
      --text-sub: #525860;
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --success: #188038;
      --danger: #d93025;
      --badge-new-bg: #fce8e6;
      --badge-new-text: #c5221f;
      --badge-plan-bg: #e8f0fe;
      --badge-plan-text: #1967d2;
      --input-bg: #ffffff;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] {
      --bg: #121417;
      --panel: #1a1d21;
      --card: #22262b;
      --border: #32373f;
      --text: #edf0f5;
      --text-sub: #9aa2ac;
      --primary: #4c8df6;
      --primary-hover: #6fa3f8;
      --success: #34a853;
      --danger: #ea4335;
      --badge-new-bg: #442322;
      --badge-new-text: #f28b82;
      --badge-plan-bg: #1e3556;
      --badge-plan-text: #8ab4f8;
      --input-bg: #14171a;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard Variable", Pretendard, "Noto Sans JP", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 500; /* 살짝 두껍게 설정하여 가독성 향상 */
      letter-spacing: -0.015em;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--text);
      background: var(--bg);
      display: flex;
      height: 100vh;
      overflow: hidden;
      transition: background 0.2s, color 0.2s;
    }

    #sidebar {
      width: 460px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      padding: 16px;
      gap: 14px;
      z-index: 10;
    }

    #map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map { width: 100%; height: 100%; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    h1 { font-size: 17px; font-weight: 700; }
    h2 { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--text); }

    .section {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-sub);
    }

    input[type="text"], input[type="password"], input[type="file"], textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      background: var(--input-bg);
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 76px; }

    button {
      width: 100%;
      padding: 9px 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      width: auto;
      padding: 6px 11px;
      font-size: 12.5px;
    }
    .btn-outline:hover { background: var(--card); }

    .btn-success { background: var(--success); }
    .btn-success:hover { opacity: 0.9; background: var(--success); }

    .btn-danger { background: var(--danger); }
    .btn-danger:hover { opacity: 0.9; background: var(--danger); }

    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn-row > button { flex: 1; }

    .paste-zone {
      border: 1.5px dashed var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12.5px;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 10px;
      background: var(--input-bg);
    }

    .status-log {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 9px 11px;
      border-radius: 6px;
      white-space: pre-wrap;
      max-height: 110px;
      overflow-y: auto;
    }

    .place-list {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input-bg);
      margin-top: 8px;
    }

    .place-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .place-item:last-child { border-bottom: none; }

    .place-info { flex: 1; cursor: pointer; }
    .place-title { font-weight: 700; font-size: 13.5px; margin-top: 3px; }
    .place-addr { color: var(--text-sub); font-size: 12px; margin-top: 2px; }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
      margin-right: 4px;
    }
    .badge-new { background: var(--badge-new-bg); color: var(--badge-new-text); }
    .badge-plan { background: var(--badge-plan-bg); color: var(--badge-plan-text); }

    .item-actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 90px;
    }
    .item-actions button {
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 600;
    }

    details > summary {
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    details > summary::-webkit-details-marker { display: none; }
    details[open] > summary { margin-bottom: 10px; }

    @media (max-width: 860px) {
      body { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 56%; border-right: none; border-top: 1px solid var(--border); }
      #map-container { height: 44%; }
    }
  </style>
</head>
<body>

<div id="sidebar">
  <div class="header-bar">
    <h1>여행 장소 추출 & 구글맵 연동</h1>
    <button id="theme-toggle-btn" class="btn-outline">라이트 모드 전환</button>
  </div>

  <!-- 1. API 키 설정 (접이식 UI로 공간 최적화) -->
  <div class="section">
    <details id="api-details" open>
      <summary>1. API 키 설정 (클릭하여 접기/펼치기)</summary>
      <label>Google Maps API Key (Maps JS & Places 활성화 필수)</label>
      <input type="password" id="gmaps-key" placeholder="AIzaSy...">
      <label>Gemini API Key (다국어 텍스트/이미지 분석용)</label>
      <input type="password" id="gemini-key" placeholder="AIzaSy...">
      <button id="save-keys-btn">API 키 저장 및 지도 연결</button>
    </details>
  </div>

  <!-- 2. 기존 계획표 (구글 내 지도 KML/CSV) 연동 -->
  <div class="section">
    <h2>2. 기존 계획표 불러오기 (구글 내 지도 KML/CSV)</h2>
    <input type="file" id="plan-file" accept=".kml,.csv" style="margin-bottom:0;">
  </div>

  <!-- 3. 사진/릴스/숏츠 다중 장소 추출 -->
  <div class="section">
    <h2>3. 릴스·숏츠·사진 다중 추출 (한/영/일)</h2>
    <label>여행 지역 힌트 (동음이의어 방지용)</label>
    <input type="text" id="region-hint" placeholder="예: 일본 교토, 오사카 / Tokyo / 서울">

    <label>캡처 이미지 파일 선택 (다중 선택 가능, 자동 압축됨)</label>
    <input type="file" id="image-files" accept="image/*" multiple>
    <div id="paste-zone" class="paste-zone">
      또는 화면 캡처 후 여기에 <strong>Ctrl + V</strong> 로 이미지 바로 붙여넣기 (<span id="pasted-count">0</span>장 대기 중)
    </div>

    <label>릴스·숏츠 본문 텍스트, 댓글, 또는 가게명 목록</label>
    <textarea id="raw-text" placeholder="가게 이름, 주소, 인스타 릴스/유튜브 숏츠 설명란 텍스트를 여러 개 입력하세요."></textarea>

    <button id="extract-btn">장소 일괄 추출 및 지도에 표시</button>
  </div>

  <!-- 4. 등록된 장소 목록 및 구글맵 바로 열기 -->
  <div class="section">
    <h2>4. 등록된 장소 (<span id="place-count">0</span>개)</h2>
    <div id="status-log" class="status-log">API 키를 입력하고 지도를 초기화하세요.</div>

    <!-- 구글맵 연동 액션 버튼 모음 -->
    <div class="btn-row">
      <button id="open-all-route-btn" class="btn-success" title="최대 11개 장소를 구글맵 다중 경유지 경로로 한 번에 엽니다">구글맵 다중 경로로 열기</button>
      <button id="open-mymaps-btn" class="btn-outline" title="구글 내 지도(My Maps) 웹사이트를 새 창으로 엽니다">구글 '내 지도' 열기</button>
    </div>

    <ul id="place-list" class="place-list"></ul>

    <div class="btn-row">
      <button id="export-kml-btn" class="btn-outline">KML 다운로드</button>
      <button id="export-csv-btn" class="btn-outline">CSV 다운로드</button>
      <button id="clear-all-btn" class="btn-danger" style="flex:0.6;">전체 삭제</button>
    </div>
  </div>
</div>

<div id="map-container">
  <div id="map"></div>
</div>

<script>
  // Google Maps 다크모드 스타일 정의
  const DARK_MAP_STYLE = [
    { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
    { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
    { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
    { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
    { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
    { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#263c3f" }] },
    { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
    { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
    { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#9ca5b3" }] },
    { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#746855" }] },
    { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] },
    { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#515c6d" }] }
  ];

  let map = null;
  let placesService = null;
  let activeInfoWindow = null;
  let markers = [];
  let savedPlaces = [];
  let pastedBlobs = [];

  const logEl = document.getElementById('status-log');
  const placeListEl = document.getElementById('place-list');
  const placeCountEl = document.getElementById('place-count');

  function logStatus(msg) {
    logEl.textContent = msg;
  }

  // 초기 로드: 테마, API 키, 저장된 장소 복원
  window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('TRAVEL_THEME') || 'dark';
    applyTheme(savedTheme);

    const savedGmapsKey = localStorage.getItem('TRAVEL_GMAPS_KEY') || '';
    const savedGeminiKey = localStorage.getItem('TRAVEL_GEMINI_KEY') || '';
    document.getElementById('gmaps-key').value = savedGmapsKey;
    document.getElementById('gemini-key').value = savedGeminiKey;

    try {
      const cachedPlaces = localStorage.getItem('TRAVEL_SAVED_PLACES');
      if (cachedPlaces) savedPlaces = JSON.parse(cachedPlaces);
    } catch (e) {
      savedPlaces = [];
    }

    if (savedGmapsKey && savedGeminiKey) {
      document.getElementById('api-details').removeAttribute('open');
      loadGoogleMapsScript(savedGmapsKey);
    } else {
      renderListOnly();
    }
  });

  // 다크모드 토글
  document.getElementById('theme-toggle-btn').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('TRAVEL_THEME', theme);
    document.getElementById('theme-toggle-btn').textContent =
      theme === 'dark' ? '라이트 모드 전환' : '다크 모드 전환';
    if (map) {
      map.setOptions({ styles: theme === 'dark' ? DARK_MAP_STYLE : [] });
    }
  }

  // 클립보드 이미지 붙여넣기 (Ctrl+V) 지원
  window.addEventListener('paste', (e) => {
    const items = e.clipboardData?.items;
    if (!items) return;
    let added = 0;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        const blob = item.getAsFile();
        if (blob) {
          pastedBlobs.push(blob);
          added++;
        }
      }
    }
    if (added > 0) {
      document.getElementById('pasted-count').textContent = pastedBlobs.length;
      logStatus(`클립보드에서 이미지 ${added}장이 추가되었습니다. (총 ${pastedBlobs.length}장 대기 중)`);
    }
  });

  // API 키 저장
  document.getElementById('save-keys-btn').addEventListener('click', () => {
    const gmapsKey = document.getElementById('gmaps-key').value.trim();
    const geminiKey = document.getElementById('gemini-key').value.trim();
    if (!gmapsKey || !geminiKey) {
      logStatus('오류: Google Maps API 키와 Gemini API 키를 모두 입력하세요.');
      return;
    }
    localStorage.setItem('TRAVEL_GMAPS_KEY', gmapsKey);
    localStorage.setItem('TRAVEL_GEMINI_KEY', geminiKey);
    document.getElementById('api-details').removeAttribute('open');
    loadGoogleMapsScript(gmapsKey);
  });

  function loadGoogleMapsScript(apiKey) {
    if (window.google && window.google.maps) {
      initMap();
      return;
    }
    logStatus('Google Maps 스크립트 로드 중...');
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&libraries=places&language=ko&callback=initMap`;
    script.async = true;
    script.defer = true;
    script.onerror = () => logStatus('오류: Google Maps 로드 실패. API 키 및 권한을 확인하세요.');
    document.head.appendChild(script);
  }

  window.initMap = function() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 34.6937, lng: 135.5023 }, // 기본 중심: 오사카/간사이
      zoom: 6,
      styles: isDark ? DARK_MAP_STYLE : [],
      mapTypeControl: true
    });
    placesService = new google.maps.places.PlacesService(map);
    activeInfoWindow = new google.maps.InfoWindow();
    renderMapAndList();
    logStatus('지도 준비 완료. 이미지/텍스트를 입력하거나 기존 일정을 불러오세요.');
  };

  // 이미지 리사이징 및 JPEG 압축 최적화 (최대 1280px, 용량 대폭 절감)
  function compressAndEncodeImage(fileOrBlob) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(fileOrBlob);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const MAX_DIM = 1280;
        let { width, height } = img;
        if (width > MAX_DIM || height > MAX_DIM) {
          if (width > height) {
            height = Math.round((height * MAX_DIM) / width);
            width = MAX_DIM;
          } else {
            width = Math.round((width * MAX_DIM) / height);
            height = MAX_DIM;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        resolve({
          inlineData: {
            data: dataUrl.split(',')[1],
            mimeType: 'image/jpeg'
          }
        });
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  // Gemini API 다국어 장소 추출 실행
  document.getElementById('extract-btn').addEventListener('click', async () => {
    const geminiKey = localStorage.getItem('TRAVEL_GEMINI_KEY');
    if (!geminiKey || !placesService) {
      logStatus('오류: 먼저 API 키를 저장하고 지도를 초기화하세요.');
      return;
    }

    const regionHint = document.getElementById('region-hint').value.trim();
    const rawText = document.getElementById('raw-text').value.trim();
    const fileInput = document.getElementById('image-files');
    const allImages = [...Array.from(fileInput.files), ...pastedBlobs];

    if (!rawText && allImages.length === 0) {
      logStatus('오류: 이미지나 텍스트를 최소 1개 이상 입력하세요.');
      return;
    }

    const btn = document.getElementById('extract-btn');
    btn.disabled = true;
    logStatus(`1/2단계: 이미지 ${allImages.length}장 압축 및 Gemini AI 다국어 분석 중...`);

    try {
      const parts = await Promise.all(allImages.map(img => compressAndEncodeImage(img)));

      const prompt = `
당신은 한국어·영어·일본어 다국어 여행 장소 데이터 추출기입니다.
제공된 이미지(인스타그램 릴스, 유튜브 숏츠 캡처, 지도 화면 등)와 텍스트에서 모든 식당, 카페, 상점, 숙소, 관광지 이름을 추출하세요.
지역 힌트: "${regionHint || '문맥에서 자동 추론'}"

규칙:
1. search_query: Google Maps 검색 정확도를 극대화하기 위해 반드시 [지역명 + 현지 원문 상호명] 조합으로 작성하세요. (예: 일본이면 일본어 한자/가나 상호명과 도시명 결합, 영어권이면 영문 상호명과 도시명 결합)
2. display_name: 한국어 사용자가 읽기 편하도록 "한국어 표기 (현지 원문)" 형태로 작성하세요.
3. category: 음식점, 카페, 쇼핑, 관광지, 숙소 중 택1.
`;
      parts.push({ text: `${prompt}\n\n[입력 텍스트]:\n${rawText || '(없음)'}` });

      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(geminiKey)}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: {
                    display_name: { type: "STRING" },
                    search_query: { type: "STRING" },
                    category: { type: "STRING" },
                    notes: { type: "STRING" }
                  },
                  required: ["display_name", "search_query", "category"]
                }
              }
            }
          })
        }
      );

      if (!response.ok) throw new Error(`Gemini API 오류 (HTTP ${response.status})`);

      const data = await response.json();
      const extracted = JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text || '[]');

      if (extracted.length === 0) {
        logStatus('추출된 장소가 없습니다. 이미지나 텍스트를 확인하세요.');
        return;
      }

      logStatus(`2/2단계: 추출된 ${extracted.length}개 장소를 Google Maps에서 검증 중...`);
      let okCount = 0;
      const failed = [];

      for (let i = 0; i < extracted.length; i++) {
        const item = extracted[i];
        // 쿼터 제한(OVER_QUERY_LIMIT) 방지를 위한 순차 딜레이 호출
        const found = await searchPlaceWithRetry(item.search_query);
        if (found && found.geometry?.location) {
          addPlace({
            id: found.place_id || `new-${Date.now()}-${i}`,
            placeId: found.place_id || '',
            name: item.display_name,
            officialName: found.name || '',
            address: found.formatted_address || '',
            lat: found.geometry.location.lat(),
            lng: found.geometry.location.lng(),
            category: item.category || '기타',
            sourceType: 'NEW',
            notes: item.notes || item.search_query
          });
          okCount++;
        } else {
          failed.push(item.display_name);
        }
      }

      // 입력 초기화
      fileInput.value = '';
      pastedBlobs = [];
      document.getElementById('pasted-count').textContent = '0';

      saveAndRender();
      let msg = `완료: ${extracted.length}개 중 ${okCount}개 장소 등록 완료.`;
      if (failed.length > 0) msg += `\n검색 실패(${failed.length}건): ${failed.join(', ')}`;
      logStatus(msg);
    } catch (err) {
      logStatus(`오류: ${err.message}`);
    } finally {
      btn.disabled = false;
    }
  });

  // Google Places 검색 (쿼터 제한 시 자동 재시도 포함)
  function searchPlaceWithRetry(query, attempt = 1) {
    return new Promise((resolve) => {
      placesService.textSearch({ query }, (results, status) => {
        if (status === google.maps.places.PlacesServiceStatus.OK && results?.length > 0) {
          resolve(results[0]);
        } else if (status === google.maps.places.PlacesServiceStatus.OVER_QUERY_LIMIT && attempt <= 3) {
          setTimeout(() => resolve(searchPlaceWithRetry(query, attempt + 1)), 400 * attempt);
        } else {
          resolve(null);
        }
      });
    });
  }

  function addPlace(placeObj) {
    const duplicate = savedPlaces.some(p =>
      (p.placeId && p.placeId === placeObj.placeId) ||
      (Math.abs(p.lat - placeObj.lat) < 0.0001 && Math.abs(p.lng - placeObj.lng) < 0.0001)
    );
    if (!duplicate) savedPlaces.push(placeObj);
  }

  function saveAndRender() {
    localStorage.setItem('TRAVEL_SAVED_PLACES', JSON.stringify(savedPlaces));
    renderMapAndList();
  }

  // 개별 장소를 위한 공식 Google Maps URL 생성 (place_id 포함 시 100% 일치 매장 오픈)
  function buildSingleGoogleMapUrl(place) {
    const base = 'https://www.google.com/maps/search/?api=1';
    const query = encodeURIComponent(place.officialName || place.name || `${place.lat},${place.lng}`);
    if (place.placeId) {
      return `${base}&query=${query}&query_place_id=${encodeURIComponent(place.placeId)}`;
    }
    return `${base}&query=${place.lat},${place.lng}`;
  }

  function renderListOnly() {
    placeCountEl.textContent = savedPlaces.length;
    placeListEl.innerHTML = savedPlaces.map((p, idx) => `
      <li class="place-item" data-idx="${idx}">
        <div class="place-info" data-action="focus">
          <span class="badge ${p.sourceType === 'PLAN' ? 'badge-plan' : 'badge-new'}">
            ${p.sourceType === 'PLAN' ? '기존일정' : '신규추출'}
          </span>
          <span style="font-size:12px;color:var(--text-sub);">${escapeHtml(p.category)}</span>
          <div class="place-title">${escapeHtml(p.name)}</div>
          <div class="place-addr">${escapeHtml(p.address)}</div>
        </div>
        <div class="item-actions">
          <button class="btn-success" data-action="open-gmap">구글맵 열기</button>
          <button class="btn-danger" data-action="delete">삭제</button>
        </div>
      </li>
    `).join('');
  }

  function renderMapAndList() {
    renderListOnly();
    if (!map) return;

    markers.forEach(m => m.setMap(null));
    markers = [];

    const bounds = new google.maps.LatLngBounds();

    savedPlaces.forEach((place, idx) => {
      const position = { lat: place.lat, lng: place.lng };
      bounds.extend(position);

      const pinColor = place.sourceType === 'PLAN' ? '#1a73e8' : '#ea4335';
      const marker = new google.maps.Marker({
        position,
        map,
        title: place.name,
        icon: {
          path: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z",
          fillColor: pinColor,
          fillOpacity: 1,
          strokeWeight: 1.5,
          strokeColor: "#ffffff",
          scale: 1.65,
          anchor: new google.maps.Point(12, 22)
        }
      });

      marker.addListener('click', () => {
        const gmapUrl = buildSingleGoogleMapUrl(place);
        activeInfoWindow.setContent(`
          <div style="color:#202124;font-family:inherit;font-size:13px;max-width:250px;line-height:1.45;">
            <div style="font-weight:700;font-size:14px;margin-bottom:3px;">${escapeHtml(place.name)}</div>
            <div style="color:#5f6368;font-size:12px;margin-bottom:6px;">${escapeHtml(place.address)}</div>
            <a href="${gmapUrl}" target="_blank" rel="noopener"
               style="display:inline-block;padding:6px 10px;background:#1a73e8;color:#fff;text-decoration:none;border-radius:4px;font-weight:600;font-size:12px;">
               구글 맵에서 바로 열기
            </a>
          </div>
        `);
        activeInfoWindow.open(map, marker);
      });

      markers.push(marker);
    });

    if (savedPlaces.length > 0) {
      map.fitBounds(bounds);
    }
  }

  // 리스트 이벤트 위임 (포커스, 구글맵 바로 열기, 삭제)
  placeListEl.addEventListener('click', (e) => {
    const li = e.target.closest('.place-item');
    if (!li) return;
    const idx = parseInt(li.getAttribute('data-idx'), 10);
    const place = savedPlaces[idx];
    if (!place) return;

    const actionEl = e.target.closest('[data-action]');
    const action = actionEl ? actionEl.getAttribute('data-action') : 'focus';

    if (action === 'open-gmap') {
      window.open(buildSingleGoogleMapUrl(place), '_blank', 'noopener');
    } else if (action === 'delete') {
      savedPlaces.splice(idx, 1);
      saveAndRender();
    } else if (action === 'focus' && map && markers[idx]) {
      map.setCenter({ lat: place.lat, lng: place.lng });
      map.setZoom(16);
      google.maps.event.trigger(markers[idx], 'click');
    }
  });

  // 여러 장소를 한 번에 구글맵 다중 경유지 경로로 열기 (최대 11개 지점 공식 지원)
  document.getElementById('open-all-route-btn').addEventListener('click', () => {
    if (savedPlaces.length === 0) {
      logStatus('열 수 있는 장소가 없습니다.');
      return;
    }
    if (savedPlaces.length === 1) {
      window.open(buildSingleGoogleMapUrl(savedPlaces[0]), '_blank', 'noopener');
      return;
    }
    const sliced = savedPlaces.slice(0, 11);
    const origin = `${sliced[0].lat},${sliced[0].lng}`;
    const destination = `${sliced[sliced.length - 1].lat},${sliced[sliced.length - 1].lng}`;
    const waypoints = sliced.slice(1, -1).map(p => `${p.lat},${p.lng}`).join('|');

    let url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}`;
    if (waypoints) url += `&waypoints=${encodeURIComponent(waypoints)}`;

    window.open(url, '_blank', 'noopener');
  });

  // 구글 내 지도(Google My Maps) 사이트 바로 열기
  document.getElementById('open-mymaps-btn').addEventListener('click', () => {
    window.open('https://www.google.com/maps/d/', '_blank', 'noopener');
  });

  // 전체 삭제
  document.getElementById('clear-all-btn').addEventListener('click', () => {
    if (savedPlaces.length === 0) return;
    savedPlaces = [];
    saveAndRender();
    logStatus('모든 장소 목록이 초기화되었습니다.');
  });

  // 기존 계획표 (KML / CSV) 불러오기
  document.getElementById('plan-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const ext = file.name.split('.').pop().toLowerCase();
    let count = 0;

    if (ext === 'kml') {
      const xmlDoc = new DOMParser().parseFromString(text, "text/xml");
      const placemarks = xmlDoc.getElementsByTagName("Placemark");
      for (let i = 0; i < placemarks.length; i++) {
        const name = placemarks[i].getElementsByTagName("name")[0]?.textContent?.trim() || `기존 일정 ${i + 1}`;
        const desc = placemarks[i].getElementsByTagName("description")[0]?.textContent?.trim() || 'KML 계획표';
        const coords = placemarks[i].getElementsByTagName("coordinates")[0]?.textContent?.trim().split(',');
        if (coords && coords.length >= 2) {
          const lng = parseFloat(coords[0]);
          const lat = parseFloat(coords[1]);
          if (!isNaN(lat) && !isNaN(lng)) {
            addPlace({
              id: `plan-kml-${Date.now()}-${i}`,
              placeId: '',
              name,
              officialName: name,
              address: desc,
              lat,
              lng,
              category: '기존 일정',
              sourceType: 'PLAN',
              notes: 'KML 로드'
            });
            count++;
          }
        }
      }
    } else if (ext === 'csv') {
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      if (lines.length > 1) {
        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
        const nameIdx = headers.findIndex(h => h.includes('name') || h.includes('이름') || h.includes('title'));
        const latIdx = headers.findIndex(h => h.includes('lat') || h.includes('위도'));
        const lngIdx = headers.findIndex(h => h.includes('lng') || h.includes('lon') || h.includes('경도'));
        const addrIdx = headers.findIndex(h => h.includes('address') || h.includes('주소'));

        for (let i = 1; i < lines.length; i++) {
          const cols = parseCsvLine(lines[i]);
          const lat = parseFloat(cols[latIdx]);
          const lng = parseFloat(cols[lngIdx]);
          if (!isNaN(lat) && !isNaN(lng)) {
            const name = cols[nameIdx] || `기존 일정 ${i}`;
            addPlace({
              id: `plan-csv-${Date.now()}-${i}`,
              placeId: '',
              name,
              officialName: name,
              address: addrIdx !== -1 ? cols[addrIdx] : 'CSV 계획표',
              lat,
              lng,
              category: '기존 일정',
              sourceType: 'PLAN',
              notes: 'CSV 로드'
            });
            count++;
          }
        }
      }
    }

    e.target.value = '';
    saveAndRender();
    logStatus(`기존 계획표에서 ${count}개 장소를 불러와 파란색 핀으로 표시했습니다.`);
  });

  function parseCsvLine(line) {
    const res = [];
    let cur = '', inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') inQuotes = !inQuotes;
      else if (c === ',' && !inQuotes) { res.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    res.push(cur.trim());
    return res;
  }

  // CSV 내보내기
  document.getElementById('export-csv-btn').addEventListener('click', () => {
    if (savedPlaces.length === 0) return logStatus('내보낼 장소가 없습니다.');
    const header = 'Name,Category,Source,Address,Latitude,Longitude,GoogleMapsURL\n';
    const rows = savedPlaces.map(p => {
      const q = s => `"${String(s || '').replace(/"/g, '""')}"`;
      return [q(p.name), q(p.category), q(p.sourceType), q(p.address), p.lat, p.lng, q(buildSingleGoogleMapUrl(p))].join(',');
    }).join('\n');
    downloadBlob('\uFEFF' + header + rows, 'google_mymaps_places.csv', 'text/csv;charset=utf-8;');
  });

  // KML 내보내기
  document.getElementById('export-kml-btn').addEventListener('click', () => {
    if (savedPlaces.length === 0) return logStatus('내보낼 장소가 없습니다.');
    const placemarks = savedPlaces.map(p => `
      <Placemark>
        <name>${escapeXml(p.name)}</name>
        <description>${escapeXml(`[${p.category}] ${p.address} \vert{}${buildSingleGoogleMapUrl(p)}`)}</description>
        <Point><coordinates>${p.lng},${p.lat},0</coordinates></Point>
      </Placemark>`).join('\n');
    const kml = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Travel Places</name>${placemarks}</Document></kml>`;
    downloadBlob(kml, 'google_mymaps_places.kml', 'application/vnd.google-earth.kml+xml');
  });

  function downloadBlob(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function escapeXml(str) {
    return escapeHtml(str).replace(/'/g, '&apos;');
  }
</script>
</body>
</html>
