<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TripSync Master — 장소·먹거리·쇼핑 실시간 플래너</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f4f7;
      --surface: #ffffff;
      --surface-2: #f8f9fb;
      --surface-3: #eef1f6;
      --border: #e2e6ee;
      --text: #111827;
      --text-sub: #4b5563;
      --text-muted: #9ca3af;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: rgba(37, 99, 235, 0.12);
      --success: #10b981;
      --danger: #ef4444;
      --food-color: #f59e0b;
      --shop-color: #8b5cf6;
      --place-color: #2563eb;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 7px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.12);
    }

    [data-theme="dark"] {
      --bg: #0f1115;
      --surface: #181b20;
      --surface-2: #20242b;
      --surface-3: #2a2f38;
      --border: #2e343e;
      --text: #f3f4f6;
      --text-sub: #9ca3af;
      --text-muted: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-soft: rgba(59, 130, 246, 0.16);
      --success: #10b981;
      --danger: #f87171;
      --food-color: #fbbf24;
      --shop-color: #a78bfa;
      --place-color: #60a5fa;
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.3);
      --shadow-lg: 0 12px 30px -5px rgba(0,0,0,0.55);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard Variable", Pretendard, "Noto Sans JP", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 500;
      letter-spacing: -0.015em;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      color: var(--text);
      background: var(--bg);
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #app-sidebar {
      width: 460px;
      min-width: 460px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 20;
      box-shadow: var(--shadow-sm);
    }

    .app-header {
      padding: 16px 18px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, #2563eb, #8b5cf6, #f59e0b);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 15px;
    }
    .brand-title { font-size: 16.5px; font-weight: 800; letter-spacing: -0.02em; }
    .brand-sub { font-size: 11.5px; color: var(--text-sub); font-weight: 600; }

    .icon-btn {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      padding: 7px 11px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600; cursor: pointer;
    }
    .icon-btn:hover { background: var(--surface-3); }

    /* 상용 앱 탭 네비게이션 (5개 탭) */
    .tab-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
      padding: 6px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      padding: 7px 2px;
      background: transparent;
      color: var(--text-sub);
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .tab-btn:hover { color: var(--text); background: var(--surface-2); }
    .tab-btn.active { background: var(--primary-soft); color: var(--primary); }

    .tab-content {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      flex-direction: column;
      gap: 14px;
    }
    .tab-content.active { display: flex; }

    .card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px;
      box-shadow: var(--shadow-sm);
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-desc {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 12px;
      line-height: 1.45;
    }

    label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: var(--text-sub); }

    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      background: var(--surface);
      margin-bottom: 10px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 84px; }

    .segment-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      background: var(--surface);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .segment-option {
      padding: 8px 4px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-sub);
    }
    .segment-option.active[data-cat="PLACE"] { background: rgba(37,99,235,0.15); color: var(--place-color); }
    .segment-option.active[data-cat="FOOD"] { background: rgba(245,158,11,0.15); color: var(--food-color); }
    .segment-option.active[data-cat="SHOP"] { background: rgba(139,92,246,0.15); color: var(--shop-color); }

    .drop-zone {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      text-align: center;
      background: var(--surface);
      cursor: pointer;
      margin-bottom: 10px;
    }
    .drop-zone:hover { border-color: var(--primary); background: var(--surface-3); }

    .thumb-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .thumb-item { position: relative; width: 56px; height: 56px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-del {
      position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
      background: rgba(0,0,0,0.75); color: #fff; font-size: 11px; border: none; cursor: pointer;
    }

    .btn {
      width: 100%; padding: 10px 14px; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-md); font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface-3); color: var(--text); border: 1px solid var(--border); }
    .btn-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* 아이템 카드 스타일 */
    .filter-row { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
    .filter-row input, .filter-row select { margin-bottom: 0; }

    .item-list-wrap { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; padding-right: 2px; }

    .item-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-card.done { opacity: 0.6; background: var(--surface); }

    .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .item-title-row { display: flex; align-items: center; gap: 8px; }
    .cat-badge {
      font-size: 10.5px; font-weight: 800; padding: 2px 6px; border-radius: 4px; color: #fff;
    }
    .cat-badge.PLACE { background: var(--place-color); }
    .cat-badge.FOOD { background: var(--food-color); color: #111; }
    .cat-badge.SHOP { background: var(--shop-color); }

    .item-title { font-size: 14px; font-weight: 700; word-break: keep-all; }
    .item-desc { font-size: 12px; color: var(--text-sub); margin-top: 2px; }

    .item-actions {
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid var(--border); padding-top: 8px;
    }
    .mini-btn {
      padding: 5px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 700;
      border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    .mini-btn:hover { background: var(--surface-3); }
    .mini-btn.google-live { background: #2563eb; color: #fff; border: none; }
    .mini-btn.del { color: var(--danger); }

    #map-wrapper { flex: 1; height: 100%; position: relative; }
    #map { width: 100%; height: 100%; }

    .map-floating-bar {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      display: flex; gap: 8px; background: var(--surface); padding: 7px 10px;
      border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-lg);
    }
    .chip-btn {
      padding: 6px 11px; border-radius: 99px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text-sub); font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .chip-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    #toast-box {
      position: fixed; bottom: 20px; right: 20px; z-index: 9999;
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-left: 4px solid var(--primary); padding: 12px 16px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 600; transform: translateY(120%); opacity: 0; transition: all 0.25s ease;
    }
    #toast-box.show { transform: translateY(0); opacity: 1; }

    .empty-state { text-align: center; padding: 36px 16px; color: var(--text-sub); font-size: 13px; }
  </style>
</head>
<body>

<aside id="app-sidebar">
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <div class="brand-title">TripSync Master</div>
        <div class="brand-sub">장소·편의점음식·쇼핑물품 실시간 플래너</div>
      </div>
    </div>
    <button id="theme-btn" class="icon-btn">라이트 모드</button>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="tab-add">장소/음식추가</button>
    <button class="tab-btn" data-tab="tab-places">여행장소 <span id="cnt-place" class="badge">0</span></button>
    <button class="tab-btn" data-tab="tab-foods">편의점/먹거리 <span id="cnt-food" class="badge">0</span></button>
    <button class="tab-btn" data-tab="tab-shops">구매물건 <span id="cnt-shop" class="badge">0</span></button>
    <button class="tab-btn" data-tab="tab-settings">설정</button>
  </nav>

  <!-- [탭 1] 통합 추가 탭 -->
  <section id="tab-add" class="tab-content active">
    <div class="card">
      <div class="card-title">어떤 항목을 추가하시겠습니까?</div>
      <div class="segment-group">
        <div class="segment-option active" data-cat="PLACE" onclick="setCategory('PLACE')">여행 장소/식당</div>
        <div class="segment-option" data-cat="FOOD" onclick="setCategory('FOOD')">편의점/음식</div>
        <div class="segment-option" data-cat="SHOP" onclick="setCategory('SHOP')">구매 물건</div>
      </div>

      <label>지역/국가 힌트 (예: 일본 교토, 오사카 편의점 / 도쿄 세븐일레븐)</label>
      <input type="text" id="input-hint" placeholder="예: 일본 오사카 / 시드니 / 서울">

      <label>음식 사진, 제품 사진 또는 릴스 캡처 (선택사항, 다중 가능)</label>
      <input type="file" id="image-input" accept="image/*" multiple style="display:none;">
      <div class="drop-zone" onclick="document.getElementById('image-input').click()">
        <div style="font-weight:700; font-size:13px;">+ 사진 선택 또는 화면 캡처 후 Ctrl+V (⌘+V)</div>
        <div style="font-size:11.5px; color:var(--text-sub); margin-top:2px;">사진 속 음식이나 물건 이름을 AI가 자동 판독합니다</div>
      </div>
      <div id="thumb-container" class="thumb-list"></div>

      <label>이름, 가게명, 편의점 상품명 또는 메모 (줄바꿈으로 여러 개 동시 입력 가능)</label>
      <textarea id="input-text" placeholder="예:&#10;로손 타마고샌드 (Lawson 卵サンド)&#10;이치란 라멘 도톤보리점&#10;산토리 위스키 토리스 하이볼"></textarea>

      <button id="add-btn" class="btn">실시간 인식 및 저장하기</button>
    </div>
  </section>

  <!-- [탭 2] 여행 장소 관리 탭 -->
  <section id="tab-places" class="tab-content">
    <div class="filter-row">
      <input type="text" id="search-place" placeholder="장소 검색..." style="flex:1;" oninput="renderPlaces()">
    </div>
    <div id="list-places" class="item-list-wrap"></div>
  </section>

  <!-- [탭 3] 편의점 및 먹거리 관리 탭 -->
  <section id="tab-foods" class="tab-content">
    <div class="filter-row">
      <input type="text" id="search-food" placeholder="편의점 음식/먹거리 검색..." style="flex:1;" oninput="renderFoods()">
    </div>
    <div id="list-foods" class="item-list-wrap"></div>
  </section>

  <!-- [탭 4] 구매 물건 관리 탭 -->
  <section id="tab-shops" class="tab-content">
    <div class="filter-row">
      <input type="text" id="search-shop" placeholder="구매 물건 검색..." style="flex:1;" oninput="renderShops()">
    </div>
    <div id="list-shops" class="item-list-wrap"></div>
  </section>

  <!-- [탭 5] 설정 탭 -->
  <section id="tab-settings" class="tab-content">
    <div class="card">
      <div class="card-title">API 키 설정 (안전 저장)</div>
      <label>Google Maps API Key</label>
      <input type="password" id="gmaps-key" placeholder="AIzaSy...">
      <label>Gemini API Key</label>
      <input type="password" id="gemini-key" placeholder="AIzaSy...">
      <button id="save-keys-btn" class="btn">저장 및 적용</button>
    </div>
  </section>
</aside>

<main id="map-wrapper">
  <div class="map-floating-bar">
    <button class="chip-btn active" onclick="setMapFilter('ALL')">전체 지도</button>
    <button class="chip-btn" onclick="setMapFilter('PLACE')">장소만 보기</button>
  </div>
  <div id="map"></div>
</main>

<div id="toast-box">완료</div>

<script>
  let map = null;
  let placesService = null;
  let activeInfoWindow = null;
  let markers = [];

  let items = []; // { id, category: 'PLACE'|'FOOD'|'SHOP', name, address, lat, lng, placeId, memo, done }
  let currentCategory = 'PLACE';
  let pendingImages = [];
  let mapFilter = 'ALL';

  function showToast(msg) {
    const box = document.getElementById('toast-box');
    box.textContent = msg;
    box.classList.add('show');
    setTimeout(() => box.classList.remove('show'), 3500);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const theme = localStorage.getItem('TRIP_THEME') || 'dark';
    applyTheme(theme);

    const gKey = localStorage.getItem('TRAVEL_GMAPS_KEY') || '';
    const aiKey = localStorage.getItem('TRAVEL_GEMINI_KEY') || '';
    document.getElementById('gmaps-key').value = gKey;
    document.getElementById('gemini-key').value = aiKey;

    try {
      const saved = localStorage.getItem('TRIP_MASTER_ITEMS');
      if (saved) items = JSON.parse(saved);
    } catch(e) { items = []; }

    renderAll();

    if (gKey) loadGoogleMaps(gKey);
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === tabId));
  }

  function setCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.segment-option').forEach(el => {
      el.classList.toggle('active', el.dataset.cat === cat);
    });
  }

  document.getElementById('theme-btn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('TRIP_THEME', theme);
    document.getElementById('theme-btn').textContent = theme === 'dark' ? '라이트 모드' : '다크 모드';
  }

  document.getElementById('image-input').addEventListener('change', (e) => {
    addFiles(Array.from(e.target.files));
    e.target.value = '';
  });

  window.addEventListener('paste', (e) => {
    const files = Array.from(e.clipboardData?.items || [])
      .filter(i => i.type.startsWith('image/'))
      .map(i => i.getAsFile()).filter(Boolean);
    if (files.length > 0) {
      addFiles(files);
      switchTab('tab-add');
      showToast(`클립보드 이미지 ${files.length장이 추가되었습니다.`);
    }
  });

  function addFiles(files) {
    files.forEach(f => pendingImages.push({ blob: f, url: URL.createObjectURL(f) }));
    renderThumbs();
  }

  function renderThumbs() {
    document.getElementById('thumb-container').innerHTML = pendingImages.map((img, i) => `
      <div class="thumb-item"><img src="${img.url}"><button class="thumb-del" onclick="pendingImages.splice(${i},1);renderThumbs()">×</button></div>
    `).join('');
  }

  document.getElementById('save-keys-btn').addEventListener('click', () => {
    const gKey = document.getElementById('gmaps-key').value.trim();
    const aiKey = document.getElementById('gemini-key').value.trim();
    localStorage.setItem('TRAVEL_GMAPS_KEY', gKey);
    localStorage.setItem('TRAVEL_GEMINI_KEY', aiKey);
    loadGoogleMaps(gKey, true);
    showToast('API 키가 저장되었습니다.');
  });

  function loadGoogleMaps(apiKey, force = false) {
    if (window.google && window.google.maps && !force) return initMap();
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&libraries=places&language=ko&callback=initMap`;
    script.async = true; script.defer = true;
    document.head.appendChild(script);
  }

  window.initMap = function() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 34.6937, lng: 135.5023 }, zoom: 6, mapTypeControl: false
    });
    placesService = new google.maps.places.PlacesService(map);
    activeInfoWindow = new google.maps.InfoWindow();
    renderMapMarkers();
  };

  // 실시간 인식 및 저장 실행
  document.getElementById('add-btn').addEventListener('click', async () => {
    const aiKey = localStorage.getItem('TRAVEL_GEMINI_KEY');
    const hint = document.getElementById('input-hint').value.trim();
    const rawText = document.getElementById('input-text').value.trim();

    if (!rawText && pendingImages.length === 0) return showToast('텍스트나 이미지를 입력하세요.');

    const btn = document.getElementById('add-btn');
    btn.disabled = true;
    showToast('실시간 분석 및 장소 확인 중...');

    try {
      let parsedNames = [];
      if (pendingImages.length > 0 && aiKey) {
        // 이미지가 있으면 Gemini로 음식/물건 이름 추출
        const parts = await Promise.all(pendingImages.map(img => compressImage(img.blob)));
        parts.push({ text: `사진 속 편의점 음식, 상품, 장소 이름을 한국어와 현지어로 추출하여 JSON 배열로 반환하세요. 힌트: ${hint}` });
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(aiKey)}`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ contents: [{ parts }], generationConfig: { responseMimeType: "application/json", responseSchema: { type: "ARRAY", items: { type: "STRING" } } } })
        });
        if (res.ok) {
          const data = await res.json();
          const list = JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text || '[]');
          parsedNames.push(...list);
        }
      }

      if (rawText) {
        parsedNames.push(...rawText.split(/\r?\n/).map(s => s.trim()).filter(Boolean));
      }

      let added = 0;
      for (const name of parsedNames) {
        let lat = 0, lng = 0, address = '', placeId = '';
        if (currentCategory === 'PLACE' && placesService) {
          const query = hint ? `${hint} ${name}` : name;
          const found = await searchPlace(query);
          if (found) {
            lat = found.geometry.location.lat();
            lng = found.geometry.location.lng();
            address = found.formatted_address || '';
            placeId = found.place_id || '';
          }
        }

        items.push({
          id: 'item-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
          category: currentCategory,
          name: name,
          address: address,
          lat: lat,
          lng: lng,
          placeId: placeId,
          memo: hint,
          done: false
        });
        added++;
      }

      pendingImages.forEach(i => URL.revokeObjectURL(i.url));
      pendingImages = [];
      renderThumbs();
      document.getElementById('input-text').value = '';

      saveAndRefresh();
      switchTab(currentCategory === 'PLACE' ? 'tab-places' : currentCategory === 'FOOD' ? 'tab-foods' : 'tab-shops');
      showToast(`${added}개 항목이 실시간 저장되었습니다.`);
    } catch(err) {
      showToast('오류 발생: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  });

  function searchPlace(query) {
    return new Promise(resolve => {
      placesService.textSearch({ query }, (res, status) => {
        if (status === google.maps.places.PlacesServiceStatus.OK && res?.[0]) resolve(res[0]);
        else resolve(null);
      });
    });
  }

  function compressImage(blob) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(blob);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const canvas = document.createElement('canvas');
        canvas.width = 800; canvas.height = 600;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 800, 600);
        resolve({ inlineData: { data: canvas.toDataURL('image/jpeg', 0.8).split(',')[1], mimeType: 'image/jpeg' } });
      };
      img.src = url;
    });
  }

  function saveAndRefresh() {
    localStorage.setItem('TRIP_MASTER_ITEMS', JSON.stringify(items));
    renderAll();
  }

  function renderAll() {
    document.getElementById('cnt-place').textContent = items.filter(i => i.category === 'PLACE').length;
    document.getElementById('cnt-food').textContent = items.filter(i => i.category === 'FOOD').length;
    document.getElementById('cnt-shop').textContent = items.filter(i => i.category === 'SHOP').length;

    renderPlaces();
    renderFoods();
    renderShops();
    renderMapMarkers();
  }

  function renderPlaces() {
    const keyword = document.getElementById('search-place').value.trim().toLowerCase();
    const list = items.filter(i => i.category === 'PLACE' && (!keyword || i.name.toLowerCase().includes(keyword)));
    const wrap = document.getElementById('list-places');

    if (list.length === 0) { wrap.innerHTML = `<div class="empty-state">저장된 여행 장소가 없습니다.</div>`; return; }

    wrap.innerHTML = list.map(item => `
      <div class="item-card ${item.done ? 'done' : ''}" data-id="${item.id}">
        <div class="item-top">
          <div class="item-title-row">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleDone('${item.id}')">
            <span class="cat-badge PLACE">장소</span>
            <div>
              <div class="item-title">${escapeHtml(item.name)}</div>
              <div class="item-desc">${escapeHtml(item.address || item.memo || '')}</div>
            </div>
          </div>
        </div>
        <div class="item-actions">
          <a href="https://www.google.com/search?q=${encodeURIComponent(item.name)}" target="_blank" class="mini-btn google-live">실시간 검색 ↗</a>
          <div style="display:flex;gap:5px;">
            ${item.lat ? `<button class="mini-btn" onclick="focusMap('${item.lat}','${item.lng}')">지도보기</button>` : ''}
            <button class="mini-btn del" onclick="deleteItem('${item.id}')">삭제</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderFoods() {
    const keyword = document.getElementById('search-food').value.trim().toLowerCase();
    const list = items.filter(i => i.category === 'FOOD' && (!keyword || i.name.toLowerCase().includes(keyword)));
    const wrap = document.getElementById('list-foods');

    if (list.length === 0) { wrap.innerHTML = `<div class="empty-state">저장된 편의점 음식/먹거리가 없습니다.</div>`; return; }

    wrap.innerHTML = list.map(item => `
      <div class="item-card ${item.done ? 'done' : ''}" data-id="${item.id}">
        <div class="item-top">
          <div class="item-title-row">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleDone('${item.id}')">
            <span class="cat-badge FOOD">먹거리</span>
            <div>
              <div class="item-title">${escapeHtml(item.name)}</div>
              <div class="item-desc">실시간 편의점/맛집 정보 즉시 확인 가능</div>
            </div>
          </div>
        </div>
        <div class="item-actions">
          <a href="https://www.google.com/search?q=${encodeURIComponent(item.name + ' 후기 편의점')}" target="_blank" class="mini-btn google-live">실시간 검색 ↗</a>
          <button class="mini-btn del" onclick="deleteItem('${item.id}')">삭제</button>
        </div>
      </div>
    `).join('');
  }

  function renderShops() {
    const keyword = document.getElementById('search-shop').value.trim().toLowerCase();
    const list = items.filter(i => i.category === 'SHOP' && (!keyword || i.name.toLowerCase().includes(keyword)));
    const wrap = document.getElementById('list-shops');

    if (list.length === 0) { wrap.innerHTML = `<div class="empty-state">구매할 물건이 없습니다.</div>`; return; }

    wrap.innerHTML = list.map(item => `
      <div class="item-card ${item.done ? 'done' : ''}" data-id="${item.id}">
        <div class="item-top">
          <div class="item-title-row">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleDone('${item.id}')">
            <span class="cat-badge SHOP">쇼핑</span>
            <div>
              <div class="item-title">${escapeHtml(item.name)}</div>
              <div class="item-desc">구매 필수 품목</div>
            </div>
          </div>
        </div>
        <div class="item-actions">
          <a href="https://www.google.com/search?q=${encodeURIComponent(item.name + ' 가격 구매처')}" target="_blank" class="mini-btn google-live">실시간 검색 ↗</a>
          <button class="mini-btn del" onclick="deleteItem('${item.id}')">삭제</button>
        </div>
      </div>
    `).join('');
  }

  window.toggleDone = function(id) {
    const target = items.find(i => i.id === id);
    if (target) { target.done = !target.done; saveAndRefresh(); }
  };

  window.deleteItem = function(id) {
    items = items.filter(i => i.id !== id);
    saveAndRefresh();
  };

  window.focusMap = function(lat, lng) {
    if (map) {
      map.setCenter({ lat: parseFloat(lat), lng: parseFloat(lng) });
      map.setZoom(16);
    }
  };

  function setMapFilter(filter) {
    mapFilter = filter;
    document.querySelectorAll('.chip-btn').forEach(b => b.classList.toggle('active', b.textContent.includes(filter === 'ALL' ? '전체' : '장소')));
    renderMapMarkers();
  }

  function renderMapMarkers() {
    if (!map) return;
    markers.forEach(m => m.setMap(null));
    markers = [];

    const targetList = items.filter(i => i.lat && i.lng && (mapFilter === 'ALL' || i.category === mapFilter));
    const bounds = new google.maps.LatLngBounds();

    targetList.forEach(item => {
      const pos = { lat: item.lat, lng: item.lng };
      bounds.extend(pos);
      const marker = new google.maps.Marker({ position: pos, map, title: item.name });
      marker.addListener('click', () => {
        activeInfoWindow.setContent(`<div style="color:#000; font-size:13px; font-weight:700;">${escapeHtml(item.name)}</div>`);
        activeInfoWindow.open(map, marker);
      });
      markers.push(marker);
    });

    if (targetList.length > 0) map.fitBounds(bounds);
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
